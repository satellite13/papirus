name: Build Papirus
on:
 push:
jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: APT Update
        run: apt-get update
      - name: Install Node.js and npm
        run: apt-get install -y nodejs npm
      - name: Clone repo
        run: git clone https://${{ gitverse.token }}@gitverse.ru/${{ gitverse.repository }}.git .
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
