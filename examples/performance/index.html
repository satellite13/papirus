<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Test - Papirus</title>
    <link rel="stylesheet" href="../shared/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #stats {
        position: fixed;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-family: 'SF Mono', Monaco, monospace;
        z-index: 1000;
        backdrop-filter: blur(8px);
        min-width: 180px;
      }

      #stats .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 24px;
      }

      #stats .stat-label {
        color: #9ca3af;
      }

      #stats .stat-value {
        font-weight: 600;
      }

      #stats .stat-value.good {
        color: #22c55e;
      }

      #stats .stat-value.warn {
        color: #eab308;
      }

      #stats .stat-value.bad {
        color: #ef4444;
      }

      #stats .divider {
        height: 1px;
        background: #374151;
        margin: 8px 0;
      }

      #controls {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        z-index: 1000;
        backdrop-filter: blur(8px);
      }

      #controls button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        margin-left: 8px;
      }

      #controls button.secondary {
        background: #4b5563;
      }

      #controls .control-group {
        margin-bottom: 8px;
      }

      #controls .control-group:last-child {
        margin-bottom: 0;
      }

      #controls .control-label {
        display: block;
        color: #9ca3af;
        margin-bottom: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      }

      #controls button:hover {
        background: #2563eb;
      }

      #controls span {
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div id="stats">
      <div class="stat-row">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="fps">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Frame Time</span>
        <span class="stat-value" id="frameTime">--</span>
      </div>
      <div class="divider"></div>
      <div class="stat-row">
        <span class="stat-label">Nodes</span>
        <span class="stat-value" id="nodeCount">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Edges</span>
        <span class="stat-value" id="edgeCount">0</span>
      </div>
      <div class="divider"></div>
      <div class="stat-row">
        <span class="stat-label">Render Time</span>
        <span class="stat-value" id="renderTime">--</span>
      </div>
    </div>

    <div id="controls">
      <div class="control-group">
        <span class="control-label">Elements</span><br />
        <button id="btn-100">100</button>
        <button id="btn-500">500</button>
        <button id="btn-1000">1000</button>
      </div>
      <div class="control-group">
        <span class="control-label">Zoom</span><br />
        <button id="btn-zoom-in" class="secondary">+</button>
        <button id="btn-zoom-out" class="secondary">−</button>
        <button id="btn-zoom-reset" class="secondary">Reset</button>
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module" src="app.js"></script>
  </body>
</html>
